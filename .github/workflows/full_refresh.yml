name: Full Link Refresh (Every 2 Days)

on:
  schedule:
    - cron: '0 2 */2 * *' # Türkiye saati ile sabah 05:00'te çalışır (UTC 02:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub Actions trafiğini Mac M1 (100.115.55.53) ev IP'sine yönlendirir
      - name: Connect to Tailscale via Mac M1 Exit Node
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --exit-node=100.115.55.53 --exit-node-allow-lan-access --accept-routes

      - name: Verify Public IP
        run: |
          echo "GitHub Runner Dış IP Adresi:"
          curl -s https://api.ipify.org
          echo ""

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Xvfb (Virtual Display)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # xvfb-run ile sanal ekranda (Headed modda) çalıştırarak Cloudflare'i geçer
      - name: Run Full Refresh Scraper
        env:
          FORCE_REFRESH: "true"
          PYTHONUNBUFFERED: "1"
        run: xvfb-run --auto-servernum python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add source.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: full refresh source.json links" && git push)